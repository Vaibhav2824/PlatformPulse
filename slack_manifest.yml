display_information:
  name: PlatformPulse
  description: AI support copilot for the mini data platform
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  bot_user:
    display_name: PlatformPulse
    always_online: true
  slash_commands:
    - command: /pulse
      description: Platform health and open incidents
      should_escape: false
oauth_config:
  scopes:
    bot: [app_mentions:read, chat:write, chat:write.public, commands]
settings:
  event_subscriptions:
    bot_events: [app_mention, app_home_opened]
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
